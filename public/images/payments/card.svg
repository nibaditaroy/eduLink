<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="18" fill="url(#cardBg)"/>
  <!-- Debit / Credit Card Chip & Dual-Ring Motif -->
  <g transform="translate(14, 18) scale(0.65)">
    <!-- Card Outline -->
    <rect x="0" y="0" width="80" height="52" rx="8" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2"/>
    <rect x="0" y="10" width="80" height="10" fill="#0F172A"/>
    <!-- Chip -->
    <rect x="10" y="26" width="14" height="11" rx="2" fill="#FBBF24"/>
    <!-- Mastercard Interlocking Circles -->
    <circle cx="56" cy="38" r="9" fill="#EF4444" opacity="0.9"/>
    <circle cx="68" cy="38" r="9" fill="#F59E0B" opacity="0.9"/>
  </g>
</svg>
